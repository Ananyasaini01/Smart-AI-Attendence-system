<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 AI Smart Attendance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">🎓 Smart Attendance System</h1>
                <p class="text-gray-400 text-sm mt-1">Real-time CCTV & AI Monitoring Dashboard</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-green-500/10 text-green-400 border border-green-500/20">
                    <span class="w-2 h-2 rounded-full bg-green-400 mr-2 animate-pulse"></span> SYSTEM LIVE
                </span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800/60 border border-gray-700/50 p-6 rounded-2xl">
                <p class="text-gray-400 text-sm font-medium">Total Registered Students</p>
                <p class="text-4xl font-extrabold text-white mt-2" id="stat-total">0</p>
            </div>
            <div class="bg-gray-800/60 border border-gray-700/50 p-6 rounded-2xl">
                <p class="text-gray-400 text-sm font-medium">Present Today</p>
                <p class="text-4xl font-extrabold text-green-400 mt-2" id="stat-present">0</p>
            </div>
            <div class="bg-gray-800/60 border border-gray-700/50 p-6 rounded-2xl">
                <p class="text-gray-400 text-sm font-medium">Absent Today</p>
                <p class="text-4xl font-extrabold text-red-400 mt-2" id="stat-absent">0</p>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="bg-gray-800/60 border border-gray-700/50 rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-200">📋 Today's Live Attendance Logs</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-700/40 text-gray-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Roll No</th>
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Time</th>
                            <th class="p-3">Confidence</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="divide-y divide-gray-700/40 text-gray-300">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Loading attendance data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function fetchLogs() {
            fetch('/api/attendance/today')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('stat-total').innerText = data.total || 0;
                    document.getElementById('stat-present').innerText = data.present || 0;
                    document.getElementById('stat-absent').innerText = data.absent || 0;

                    const tbody = document.getElementById('logs-tbody');
                    if (!data.records || data.records.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">No attendance marked today yet. Run main.py!</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.records.map(r => `
                        <tr class="hover:bg-gray-700/20">
                            <td class="p-3 font-mono text-blue-400">${r.roll}</td>
                            <td class="p-3 font-semibold text-white">${r.name}</td>
                            <td class="p-3 text-gray-400">${r.time}</td>
                            <td class="p-3">${(r.confidence * 100).toFixed(0)}%</td>
                            <td class="p-3">
                                <span class="px-2 py-1 rounded-md text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30">
                                    ${r.status.toUpperCase()}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(err => console.error(err));
        }

        fetchLogs();
        setInterval(fetchLogs, 3000); // Refresh every 3 seconds
    </script>
</body>
</html>
